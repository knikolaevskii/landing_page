<x-dc>
<footer ref="{{ rootRef }}" style="position:relative;background:transparent;color:#f1eada;padding:clamp(40px,5vw,64px) clamp(22px,5vw,60px) 24px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:32px;padding-bottom:32px;border-bottom:1px solid rgba(241,234,218,.18)">
    <div>
      <img src="assets/logo-beige.svg" alt="The Court House" style="height:clamp(72px,7vw,96px);width:auto;display:block;margin-bottom:18px"/>
      <p data-i18n="foot.tagline" style="margin:0;max-width:320px;font:400 15px/1.6 'EB Garamond',serif;color:rgba(241,234,218,.7)">Premium pickleball courts and a community built around the game.</p>
    </div>
    <div>
      <div data-i18n="foot.visit" style="font:500 10.5px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(241,234,218,.55)">Visit Us</div>
      <div style="margin-top:12px;font:400 15px/1.7 'EB Garamond',serif;color:rgba(241,234,218,.82)">
        {{ addressLine1 }}<br/>{{ addressLine2 }}<br/><a href="{{ phoneHref }}" style="color:rgba(241,234,218,.82)" style-hover="color:#f1eada">{{ phoneDisplay }}</a>
      </div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:20px;font:400 11px/1 'Jost',sans-serif;letter-spacing:.06em;color:rgba(241,234,218,.5)">
    <span style="white-space:nowrap">© 2026 The Court House</span>
    <div style="display:flex;gap:20px">
      <a href="{{ privacy }}" data-i18n="foot.privacy" style="display:inline-flex;align-items:center;min-height:44px;color:rgba(241,234,218,.5)" style-hover="color:#f1eada">Privacy Policy</a>
      <a href="{{ terms }}" data-i18n="foot.terms" style="display:inline-flex;align-items:center;min-height:44px;color:rgba(241,234,218,.5)" style-hover="color:#f1eada">Terms</a>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
/* Shared footer. Address, phone and legal links all resolve from the single
   config block in assets/site.js, so filling in a real phone number or privacy
   URL is a one-file edit that updates every page at once. */
class Component extends DCLogic {
  /* This component is fetched asynchronously, so it mounts AFTER the page has
     already run its translation pass — it has to translate itself. */
  componentDidMount() {
    this._onLang = () => this.forceUpdate();
    window.addEventListener('tch:lang', this._onLang);
    this.syncLang();
  }
  componentWillUnmount() { window.removeEventListener('tch:lang', this._onLang); }
  componentDidUpdate() { this.syncLang(); }
  syncLang() { TCH.applyLang(this.root, TCH.lang.get()); }

  renderVals() {
    const c = TCH.CONTACT;
    return {
      rootRef: el => { if (el) { this.root = el; this.syncLang(); } },
      addressLine1: c.addressLine1,
      addressLine2: c.addressLine2,
      phoneDisplay: c.phoneDisplay,
      phoneHref: c.phoneHref,
      privacy: TCH.LINKS.privacy,
      terms: TCH.LINKS.terms
    };
  }
}
</script>
