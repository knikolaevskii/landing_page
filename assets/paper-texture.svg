<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- Two irregular fiber scales avoid the fine, uniform sandpaper appearance. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.045 0.13" numOctaves="4" seed="17" stitchTiles="stitch" result="longFibers"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.12 0.035" numOctaves="3" seed="8" stitchTiles="stitch" result="crossFibers"/>
    <feComposite in="longFibers" in2="crossFibers" operator="arithmetic" k1="0" k2="0.65" k3="0.35" k4="0"/>
    <feColorMatrix type="matrix" values="0.333 0.333 0.334 0 0  0.333 0.333 0.334 0 0  0.333 0.333 0.334 0 0  0 0 0 0 1"/>
    <!-- Balanced highlights/shadows around neutral gray preserve the base hue. -->
    <feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 0 1 0 1 2" divisor="1" bias="0.5" edgeMode="wrap" preserveAlpha="true"/>
  </filter>
  <rect width="300" height="300" filter="url(#paper)"/>
</svg>
