<x-dc>
<nav ref="{{ navRef }}" onClick="{{ onNavClick }}" style="position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px clamp(16px,3vw,34px);background:#203c2c">

  <!-- index.html#hero: on the landing page the id exists so this smooth-scrolls;
       on a sub-page it does not, so the browser navigates home. One href, both jobs. -->
  <a href="index.html#hero" data-goto="hero" aria-label="The Court House — home" style="display:flex;align-items:center;flex-shrink:0">
    <img src="assets/logo-beige-house.svg" alt="The Court House" style="height:42px;width:auto;display:block"/>
  </a>

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:clamp(16px,2.2vw,34px);margin-left:auto">
      <sc-for list="{{ items }}" as="n">
        <a href="{{ n.href }}" data-goto="{{ n.goto }}" class="nav-link" aria-current="{{ n.current }}">{{ n.label }}</a>
      </sc-for>
    </div>
  </sc-if>

  <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <a href="{{ reserveHref }}" target="_blank" rel="noopener noreferrer" data-i18n="nav.reserve" style="padding:11px 22px;border:1px solid rgba(241,234,218,.6);border-radius:999px;color:#f1eada;font:500 12px/1 'EB Garamond',serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;transition:background .35s,color .35s" style-hover="background:#f1eada;color:#203c2c">Reserve</a>
    </sc-if>

    <div style="position:relative">
      <button onClick="{{ toggleLangMenu }}" aria-haspopup="true" aria-expanded="{{ langExpanded }}" aria-label="Select language" data-i18n-attr="aria-label:nav.language" style="display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:1px solid rgba(241,234,218,.4);border-radius:999px;padding:11px 22px;font:500 12px/1 'EB Garamond',serif;letter-spacing:.08em;color:#f1eada;cursor:pointer" style-hover="border-color:#f1eada">
        <span aria-hidden="true" style="display:block;height:12px;font-size:12px;line-height:12px;letter-spacing:0">{{ langFlag }}</span>
        <span style="font-size:9px;opacity:.7">▾</span>
      </button>
      <sc-if value="{{ langMenuOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:calc(100% + 9px);right:0;background:#fffdf7;border:1px solid rgba(32,60,44,.12);border-radius:12px;box-shadow:0 16px 40px rgba(23,20,15,.16);padding:6px;display:flex;flex-direction:column;min-width:150px;z-index:120;animation:chIn .28s cubic-bezier(.22,1,.36,1) both">
          <button onClick="{{ selectEn }}" style="display:flex;align-items:center;gap:10px;background:none;border:none;padding:10px 12px;border-radius:8px;font:500 12px/1 'EB Garamond',serif;letter-spacing:.1em;color:#2a2620;cursor:pointer;text-align:left" style-hover="background:#f1eada">
            <span style="flex:1">ENGLISH</span>
            <sc-if value="{{ isEn }}" hint-placeholder-val="{{ true }}"><span style="color:#203c2c">✓</span></sc-if>
          </button>
          <button onClick="{{ selectSk }}" style="display:flex;align-items:center;gap:10px;background:none;border:none;padding:10px 12px;border-radius:8px;font:500 12px/1 'EB Garamond',serif;letter-spacing:.1em;color:#2a2620;cursor:pointer;text-align:left" style-hover="background:#f1eada">
            <span style="flex:1">SLOVENSKY</span>
            <sc-if value="{{ isSk }}" hint-placeholder-val="{{ false }}"><span style="color:#203c2c">✓</span></sc-if>
          </button>
        </div>
      </sc-if>
    </div>


    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuExpanded }}" data-i18n-attr="aria-label:nav.menu" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:44px;background:none;border:none;padding:8px;cursor:pointer">
        <span style="width:22px;height:1.4px;background:#f1eada;display:block"></span>
        <span style="width:22px;height:1.4px;background:#f1eada;display:block"></span>
      </button>
    </sc-if>
  </div>
</nav>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ onNavClick }}" style="position:fixed;inset:0;z-index:99;background:#f1eada;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 clamp(24px,7vw,64px);animation:chFade .3s ease both">
    <sc-for list="{{ items }}" as="n">
      <a href="{{ n.href }}" data-goto="{{ n.goto }}" style="display:flex;align-items:center;min-height:48px;font-family:'EB Garamond',serif;font-size:clamp(30px,8vw,52px);line-height:1.15;color:#203c2c">{{ n.label }}</a>
    </sc-for>
    <!-- desktop shows these as the pill + dropdown; on a phone they read better inline -->
    <a href="{{ reserveHref }}" target="_blank" rel="noopener noreferrer" data-i18n="nav.reserve" style="margin-top:18px;align-self:flex-start;padding:15px 32px;background:#1f3a2b;border-radius:999px;color:#f1ead9;font:500 11px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase">Reserve</a>
    <div style="display:flex;gap:18px;margin-top:22px">
      <button onClick="{{ selectEn }}" style="background:none;border:none;padding:8px 0;font:500 11px/1 'Jost',sans-serif;letter-spacing:.16em;color:{{ enColor }};cursor:pointer">ENGLISH</button>
      <button onClick="{{ selectSk }}" style="background:none;border:none;padding:8px 0;font:500 11px/1 'Jost',sans-serif;letter-spacing:.16em;color:{{ skColor }};cursor:pointer">SLOVENSKY</button>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;string&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;string&quot;,&quot;default&quot;:&quot;booking&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* Shared navigation. Owns only its own UI state (breakpoint, menus); the page
   supplies onNav so each page keeps its own scroll offset. Language is synced
   through the global tch:lang event rather than props, so this component works
   identically no matter which page imports it. */
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      isMobile: window.innerWidth < 1000,
      menuOpen: false,
      langMenuOpen: false,
      lang: TCH.lang.get()
    };
  }

  componentDidMount() {
    this._onResize = () => {
      const isMobile = window.innerWidth < 1000;
      if (isMobile !== this.state.isMobile) this.setState({ isMobile, menuOpen: false });
    };
    this._onLang = (e) => this.setState({ lang: e.detail });
    // clicking away or hitting Escape should close the dropdown — neither worked before
    this._onDocClick = (e) => {
      if (!this.state.langMenuOpen) return;
      if (this.nav && this.nav.contains(e.target)) return;
      this.setState({ langMenuOpen: false });
    };
    this._onKey = (e) => {
      if (e.key !== 'Escape') return;
      if (this.state.langMenuOpen || this.state.menuOpen) {
        this.setState({ langMenuOpen: false, menuOpen: false });
      }
    };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('tch:lang', this._onLang);
    document.addEventListener('click', this._onDocClick);
    document.addEventListener('keydown', this._onKey);
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('tch:lang', this._onLang);
    document.removeEventListener('click', this._onDocClick);
    document.removeEventListener('keydown', this._onKey);
    document.body.style.overflow = '';
  }

  componentDidUpdate() {
    // the overlay used to let the page scroll behind it
    document.body.style.overflow = this.state.menuOpen ? 'hidden' : '';
    this.syncLang();
  }

  /* fetched asynchronously, so this mounts after the page's translation pass */
  syncLang() { TCH.applyLang(this.nav, this.state.lang); }

  setLang(lg) {
    TCH.lang.set(lg);                       // dispatches tch:lang; the page listens too
    this.setState({ lang: lg, langMenuOpen: false, menuOpen: false });
  }

  renderVals() {
    const lg = this.state.lang;
    const dict = window.TCH_SK || {};
    const active = this.props.active || '';

    const items = TCH.NAV.map(n => ({
      key: n.key,
      href: n.href,
      goto: n.goto || '',
      label: lg === 'sk' ? (dict[n.i18n] || n.en) : n.en,
      current: n.key === active ? 'page' : ''
    }));

    return {
      items,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      menuOpen: this.state.menuOpen,
      langMenuOpen: this.state.langMenuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      langExpanded: this.state.langMenuOpen ? 'true' : 'false',
      isEn: lg === 'en',
      isSk: lg === 'sk',
      langLabel: lg === 'en' ? 'EN' : 'SK',
      // flag mark from commit 3cf5030; aria-hidden, so the button keeps a text label
      langFlag: lg === 'en' ? '\u{1F1EC}\u{1F1E7}' : '\u{1F1F8}\u{1F1F0}',
      enColor: lg === 'en' ? '#203c2c' : 'rgba(32,60,44,.45)',
      skColor: lg === 'sk' ? '#203c2c' : 'rgba(32,60,44,.45)',
      reserveHref: TCH.LINKS[this.props.cta || 'booking'] || '#',

      navRef: el => { if (el) { this.nav = el; this.syncLang(); } },
      onNavClick: (e) => {
        /* Only links are our business. Without this guard the hamburger's own
           click bubbles up here and closes the menu it just opened, leaving the
           mobile menu permanently unopenable. */
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        // the page owns scrolling (it knows its own nav offset); we own the menu
        if (this.props.onNav) this.props.onNav(e);
        if (this.state.menuOpen) this.setState({ menuOpen: false });
      },
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      toggleLangMenu: () => this.setState(s => ({ langMenuOpen: !s.langMenuOpen })),
      selectEn: () => this.setLang('en'),
      selectSk: () => this.setLang('sk')
    };
  }
}
</script>
